name: publish

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # 写了 permissions 就等于把未列出的全部置为 none，checkout 需要 contents: read
    permissions:
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Update Submodule
      run: git submodule update --init --recursive
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    # Release 下各方言引用的是 MT.LightORM 的 NuGet 包（versions.props 里的 DependencyDepVersion），
    # 新版本还没发布，所以先把包打到本地目录并加成源，后面的 provider 才还原得到刚打出来的包。
    - name: Create local NuGet source
      run: |
        mkdir -p $HOME/.local-nuget
        dotnet nuget add source $HOME/.local-nuget --name local

    - name: LightORM
      run: |
        dotnet build ./src/LightOrmTableContextGenerator/LightOrmTableContextGenerator.csproj -c Release
        dotnet build ./src/LightORM/LightORM.csproj -c Release
        dotnet pack ./src/LightORM/LightORM.csproj -c Release -o $HOME/.local-nuget

    - name: LightORM.Extensions.DependencyInjection
      run: |
        dotnet build ./src/LightORM.Extensions.DependencyInjection/LightORM.Extensions.DependencyInjection.csproj -c Release
        dotnet pack ./src/LightORM.Extensions.DependencyInjection/LightORM.Extensions.DependencyInjection.csproj -c Release -o $HOME/.local-nuget

    - name: SqlServer Provider
      run: |
        dotnet build ./src/Providers/LightORM.Providers.SqlServer/LightORM.Providers.SqlServer.csproj -c Release
        dotnet pack ./src/Providers/LightORM.Providers.SqlServer/LightORM.Providers.SqlServer.csproj -c Release -o $HOME/.local-nuget

    - name: MySql Provider
      run: |
        dotnet build ./src/Providers/LightORM.Providers.MySql/LightORM.Providers.MySql.csproj -c Release
        dotnet pack ./src/Providers/LightORM.Providers.MySql/LightORM.Providers.MySql.csproj -c Release -o $HOME/.local-nuget

    - name: Oracle Provider
      run: |
        dotnet build ./src/Providers/LightORM.Providers.Oracle/LightORM.Providers.Oracle.csproj -c Release
        dotnet pack ./src/Providers/LightORM.Providers.Oracle/LightORM.Providers.Oracle.csproj -c Release -o $HOME/.local-nuget

    - name: Sqlite Provider
      run: |
        dotnet build ./src/Providers/LightORM.Providers.Sqlite/LightORM.Providers.Sqlite.csproj -c Release
        dotnet pack ./src/Providers/LightORM.Providers.Sqlite/LightORM.Providers.Sqlite.csproj -c Release -o $HOME/.local-nuget

    - name: PostgreSQL Provider
      run: |
        dotnet build ./src/Providers/LightORM.Providers.PostgreSQL/LightORM.Providers.PostgreSQL.csproj -c Release
        dotnet pack ./src/Providers/LightORM.Providers.PostgreSQL/LightORM.Providers.PostgreSQL.csproj -c Release -o $HOME/.local-nuget

    - name: Dameng Provider
      run: |
        dotnet build ./src/Providers/LightORM.Providers.Dameng/LightORM.Providers.Dameng.csproj -c Release
        dotnet pack ./src/Providers/LightORM.Providers.Dameng/LightORM.Providers.Dameng.csproj -c Release -o $HOME/.local-nuget

    - name: KingbaseES Provider
      run: |
        dotnet build ./src/Providers/LightORM.Providers.KingbaseES/LightORM.Providers.KingbaseES.csproj -c Release
        dotnet pack ./src/Providers/LightORM.Providers.KingbaseES/LightORM.Providers.KingbaseES.csproj -c Release -o $HOME/.local-nuget

    # $HOME 下的文件不在工作区内，先拷进 workspace 再当 artifact 传
    - name: Collect packages
      run: |
        mkdir -p ./nupkgs
        cp $HOME/.local-nuget/*.nupkg ./nupkgs/

    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: nupkgs
        path: ./nupkgs/*.nupkg
        if-no-files-found: error

  publish:
    needs: build
    # PR 上不发布：fork 的 PR 拿不到 id-token，发布也没有意义
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    # 必须与 nuget.org 上 Trusted Publishing 策略里的 Environment 完全一致
    # （策略里留空的话，这里也不要写）
    environment: nuget

    permissions:
      contents: read      # 同上：声明 permissions 会清空默认值
      id-token: write     # 用 GitHub OIDC 换 NuGet 临时 API Key，缺了 NuGet/login 直接 403

    steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Download packages
      uses: actions/download-artifact@v4
      with:
        name: nupkgs
        path: nupkgs

    # 临时 Key 只有 1 小时有效，且一个 OIDC token 只能换一个 key：
    # 这里 login 一次，后面把所有包一起推完，不要循环调用 login。
    - name: NuGet login (OIDC → temp API key)
      id: login
      uses: NuGet/login@v1
      with:
        # nuget.org 的「个人资料用户名」，不是邮箱，也不是显示名
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet
      run: |
        dotnet nuget push nupkgs/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
